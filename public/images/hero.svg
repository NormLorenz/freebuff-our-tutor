<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Cozy German tutoring illustration">
  <rect width="640" height="440" rx="24" fill="#f8e3d3"/>
  <rect x="0" y="330" width="640" height="110" fill="#2f6b4f"/>
  <circle cx="90" cy="70" r="34" fill="#d9a53f" opacity="0.5"/>
  <!-- window -->
  <rect x="60" y="60" width="150" height="120" rx="12" fill="#faf6ef" stroke="#c2571b" stroke-width="6"/>
  <line x1="135" y1="60" x2="135" y2="180" stroke="#c2571b" stroke-width="4"/>
  <line x1="60" y1="120" x2="210" y2="120" stroke="#c2571b" stroke-width="4"/>
  <!-- blackboard -->
  <rect x="300" y="70" width="280" height="160" rx="14" fill="#33463b" stroke="#8a5a33" stroke-width="10"/>
  <text x="330" y="130" font-family="Georgia, serif" font-size="30" fill="#faf6ef">Guten Tag!</text>
  <text x="330" y="170" font-family="Georgia, serif" font-size="22" fill="#d9a53f">der, die, das</text>
  <line x1="330" y1="195" x2="480" y2="195" stroke="#7fc7a2" stroke-width="5" stroke-linecap="round"/>
  <line x1="330" y1="212" x2="440" y2="212" stroke="#7fc7a2" stroke-width="5" stroke-linecap="round"/>
  <!-- table -->
  <rect x="180" y="330" width="300" height="18" rx="6" fill="#8a5a33"/>
  <rect x="205" y="348" width="16" height="60" fill="#8a5a33"/>
  <rect x="440" y="348" width="16" height="60" fill="#8a5a33"/>
  <!-- pretzel plate -->
  <ellipse cx="330" cy="326" rx="46" ry="12" fill="#e9d9c4"/>
  <circle cx="318" cy="312" r="12" fill="#c2571b"/>
  <circle cx="342" cy="312" r="12" fill="#a34412"/>
  <!-- teacher -->
  <circle cx="540" cy="330" r="0" fill="none"/>
  <circle cx="540" cy="292" r="26" fill="#33261d"/>
  <path d="M505 352 q35 -34 70 0 l0 40 l-70 0 z" fill="#c2571b"/>
  <!-- student -->
  <circle cx="120" cy="300" r="24" fill="#33261d"/>
  <path d="M88 352 q32 -30 64 0 l0 30 l-64 0 z" fill="#2f6b4f"/>
  <!-- speech bubble -->
  <g>
    <rect x="560" y="180" width="64" height="42" rx="10" fill="#faf6ef" stroke="#c2571b" stroke-width="3"/>
    <path d="M580 222 l-6 14 l18 -14 z" fill="#faf6ef" stroke="#c2571b" stroke-width="3"/>
    <text x="592" y="207" font-family="Georgia, serif" font-size="16" text-anchor="middle" fill="#c2571b">Ja!</text>
  </g>
  <!-- little flags -->
  <g fill="#2f6b4f">
    <rect x="0" y="0" width="8" height="640" transform="rotate(90)" opacity="0"/>
  </g>
  <path d="M20 20 h34 v22 l-17 -8 l-17 8 z" fill="#b3323f"/>
  <path d="M20 20 h34 v8 h-34 z" fill="#33261d"/>
  <path d="M20 28 h34 v8 h-34 z" fill="#d9a53f"/>
  <line x1="18" y1="44" x2="18" y2="60" stroke="#8a5a33" stroke-width="3"/>
</svg>
